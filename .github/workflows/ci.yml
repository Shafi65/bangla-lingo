name: CI
on:
  # Manual only while the GitHub account has a billing lock (failures were emailing the owner).
  # To restore automatic runs, put back: push (branches: [main]) and pull_request.
  workflow_dispatch:
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm run validate
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
